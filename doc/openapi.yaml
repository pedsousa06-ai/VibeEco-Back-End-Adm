# Componentes para serem usados de exemplo
components:
  schemas:

    # Componente de usuários
    Usuarios:
      required:
        - nome
        - email
        - senha
        - total_xp
        - coins
        - id_escolaridade
        - id_status
        - id_instituicao
        - id_nivel_acesso
        - id_level
        - id_ultimo_acesso
        - id_sexo
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        senha:
          type: string
        total_xp:
          type: integer
        coins:
          type: integer
        id_escolaridade:
          type: integer
        id_status:
          type: integer
        id_instituicao:
          type: array
          items:
            type: integer
          example: [1, 5, 12] # Exemplo visual de como o array será enviado no JSON
        id_nivel_acesso:
          type: integer
        id_level:
          type: integer
        id_ultimo_acesso:
          type: integer
        id_sexo:
          type: integer

    # Componente de missões
    Missoes:
      required:
        - nome
        - descricao
        - coins
        - total_xp_missao
        - data_inicio
        - data_termino
        - id_dificuldade
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        coins:
          type: integer
        total_xp_missao:
          type: integer
        data_inicio:
          type: string
          format: date
        data_termino:
          type: string
          format: date
        id_dificuldade:
          type: string
        
    # Componente de desafios
    Desafios:
      required:
        - nome
        - descricao
        - id_dificuldade
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        id_dificuldade:
          type: string

    # Componente de conteúdos educativos
    Educativos:
      required:
        - nome
        - descricao
        - id_anexo
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        id_anexo:
          type: array
          itens: 
            type: integer
          example: [1,4,7] # Exemplo de como adicionar os anexos

    # Componente de administradores
    Administrador:
      required:
        - nome
        - email
        - senha
        - id_nivel_acesso
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        senha: 
          type: string
        id_nivel_acesso:
          type: integer

    # Componente de premiacoes
    Premiacao:
      required:
        - nome
        - descricao
        - codigo_rastreio
        - motivo_premiacao
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        codigo_rastreio: 
          type: string
        motivo_premiacao:
          type: string

    # Componente de conquistas
    Conquistas:
      required:
        - nome
        - descricao
        - img
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        img: 
          type: string

  requestBodies:
    Usuarios:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Usuarios'

    Missoes:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Missoes'

    Desafios:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Desafios'
  
    Educativos:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Educativos'

    Administrador:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Administrador'

    Premiacao:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Premiacao'

    Conquistas:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conquistas'

    
