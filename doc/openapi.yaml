openapi: 3.0.3
info:
  title: VibeEco ADM - TechProton API
  description: API centralizada para a gestão administrativa, controle de dados e governança da plataforma VibeEco.
  termsOfService: http://swagger.io/terms/
  version: 1.0.26
externalDocs:
  description: Documentação oficial do Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento
paths:

  # ==========================================
  # Gerenciamento de Usuários
  # ==========================================
  /v1/vibeEco/administrador/usuarios:
    post:
      tags:
        - Usuários
      summary: Cadastrar novo usuário
      description: Realiza o registro de um novo usuário na base de dados do sistema.
      requestBody:
        description: Objeto contendo os dados necessários para o cadastro do usuário.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuarios'
        required: true
      responses:
        '201':
          description: Usuário criado com sucesso.
        '400':
          description: Requisição inválida (dados incorretos ou faltando).
        '500':
          description: Erro interno no servidor.
    get:
      tags:
        - Usuários
      summary: Listar usuários
      description: Retorna uma lista com todos os usuários cadastrados no sistema.
      responses:
        '200':
          description: Operação realizada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuarios'          
        '404':
          description: Nenhum usuário encontrado.
        '500':
          description: Erro interno no servidor.

  /v1/vibeEco/administrador/usuarios/{id}:
    get:
      tags:
        - Usuários
      summary: Buscar usuário por ID
      description: Retorna os detalhes de um usuário específico com base no identificador único fornecido.
      parameters:
        - name: id
          in: path
          description: Identificador único (ID) do usuário.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Operação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuarios'          
        '400':
          description: ID fornecido é inválido.
        '404':
          description: Usuário não encontrado.
        '500':
          description: Erro interno no servidor.
    put:
      tags:
        - Usuários
      summary: Atualizar usuário por ID
      description: Atualiza os dados cadastrais de um usuário existente utilizando seu identificador único.
      parameters:
        - name: id
          in: path
          description: Identificador único (ID) do usuário a ser atualizado.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Novos dados para a atualização do usuário.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuarios'
        required: true
      responses:
        '200':
          description: Usuário atualizado com sucesso.
        '400':
          description: ID fornecido ou dados da requisição são inválidos.
        '404':
          description: Usuário não encontrado.
        '500':
          description: Erro interno no servidor.
    delete:
      tags:
        - Usuários
      summary: Excluir usuário por ID
      description: Remove permanentemente um usuário da base de dados através do identificador único.
      parameters:
        - name: id
          in: path
          description: Identificador único (ID) do usuário a ser excluído.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuário excluído com sucesso.
        '400':
          description: ID fornecido é inválido.
        '404':
          description: Usuário não encontrado.
        '500':
          description: Erro interno no servidor.

  # ==========================================
  # Gerenciamento de Missões
  # ==========================================
  /v1/vibeEco/administrador/missoes:
    post:
      tags:
        - Missões
      summary: Cadastrar nova missão
      description: Cria e registra uma nova missão ecológica no sistema.
      requestBody:
        description: Objeto contendo os dados necessários para o cadastro da missão.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Missoes'
        required: true
      responses:
        '201':
          description: Missão criada com sucesso.
        '400':
          description: Requisição inválida.
        '500':
          description: Erro interno no servidor.
    get:
      tags:
        - Missões
      summary: Listar missões
      description: Retorna uma listagem de todas as missões cadastradas no sistema.
      responses:
        '200':
          description: Operação realizada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Missoes'          
        '404':
          description: Nenhuma missão encontrada.
        '500':
          description: Erro interno no servidor.

  /v1/vibeEco/administrador/missoes/{id}:
    get:
      tags:
        - Missões
      summary: Buscar missão por ID
      description: Retorna os detalhes de uma missão específica através do ID.
      parameters:
        - name: id
          in: path
          description: Identificador único (ID) da missão.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Operação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Missoes'          
        '400':
          description: ID fornecido é inválido.
        '404':
          description: Missão não encontrada.
        '500':
          description: Erro interno no servidor.
    put:
      tags:
        - Missões
      summary: Atualizar missão por ID
      description: Atualiza as informações de uma missão existente com base no seu ID.
      parameters:
        - name: id
          in: path
          description: Identificador único (ID) da missão a ser atualizada.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados atualizados da missão.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Missoes'
        required: true
      responses:
        '200':
          description: Missão atualizada com sucesso.
        '400':
          description: ID fornecido ou dados da requisição são inválidos.
        '404':
          description: Missão não encontrada.
        '500':
          description: Erro interno no servidor.
    delete:
      tags:
        - Missões
      summary: Excluir missão por ID
      description: Remove uma missão do sistema utilizando seu ID como referência.
      parameters:
        - name: id
          in: path
          description: Identificador único (ID) da missão a ser excluída.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Missão excluída com sucesso.
        '400':
          description: ID fornecido é inválido.
        '404':
          description: Missão não encontrada.
        '500':
          description: Erro interno no servidor.

