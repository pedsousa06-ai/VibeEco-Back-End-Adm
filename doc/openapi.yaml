openapi: 3.0.3
info:
  title: VibeEco ADM - TechProton
  description: API centralizada para a gestão completa e o controle de dados do VibeEco ADM
  termsOfService: http://swagger.io/terms/
  version: 1.0.26
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://
paths:

  # Documentação de usuário
  /v1/vibeEco/administrador/usuarios:
    post:
      tags:
        - Usuários
      summary: Adiciona um novo usuário
      description: Cadastra um novo usuário no banco de dados
      requestBody:
        description: JSON contendo os dados necessários do usuário para realizar o cadastro
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuarios'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '500':
          description: Error Internal Server
    get:
      tags:
        - Usuários
      summary: Lista todos os usuários
      description: Listagem de todos os usuários cadastrados no banco de dados
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuarios'          
        '404':
          description: Not Found
        '500':
          description: Error Internal Server
  /v1/vibeEco/administrador/usuarios/{id}:
    get:
      tags:
        - Usuários
      summary: Busca um usuário pelo id
      description: Retorna os dados de um usuário cadastrado no banco usando o id como referência
      parameters:
        - name: id
          in: path
          description: ID para retornar o usuário
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuarios'          
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server
    put:
      tags:
        - Usuários
      summary: Atualizar um usuário pelo id
      description: Localiza e atualiza um usuário cadastrado no banco de dados usando o id como referência
      parameters:
        - name: id
          in: path
          description: ID para localizar e atualizar o usuário
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar o usuário
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuarios'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
        '500':
          description: Error Internal Server
    delete:
      tags:
        - Usuários
      summary: Delete um usuário pelo id
      description: Localiza e exclui um usuário cadastrado no banco de dados usando o id como referência
      parameters:
        - name: id
          in: path
          description: ID para excluir o usuário
