# ==========================================
# Componentes e Schemas
# ==========================================
components:
  schemas:

    # Schema de Usuários
    Usuarios:
      required:
        - nome
        - email
        - senha
        - total_xp
        - coins
        - id_escolaridade
        - id_status
        - id_instituicao
        - id_nivel_acesso
        - id_level
        - id_ultimo_acesso
        - id_sexo
      type: object
      description: Objeto de representação de um usuário na plataforma.
      properties:
        id:
          type: integer
          description: Identificador único gerado automaticamente para o usuário.
        nome:
          type: string
          description: Nome completo do usuário.
        email:
          type: string
          format: email
          description: Endereço de e-mail corporativo ou pessoal do usuário.
        senha:
          type: string
          format: password
          description: Senha de acesso criptografada do usuário.
        total_xp:
          type: integer
          description: Quantidade total de pontos de experiência (XP) acumulados.
        coins:
          type: integer
          description: Saldo de moedas virtuais (VibeCoins) do usuário.
        id_escolaridade:
          type: integer
          description: Chave estrangeira referente ao nível de escolaridade.
        id_status:
          type: integer
          description: Chave estrangeira referente ao status atual da conta (ex. ativo, inativo).
        id_instituicao:
          type: array
          items:
            type: integer
          description: Lista de chaves estrangeiras referentes às instituições vinculadas.
          example: [1, 5, 12]
        id_nivel_acesso:
          type: integer
          description: Chave estrangeira referente ao nível de permissão/acesso do usuário.
        id_level:
          type: integer
          description: Chave estrangeira referente ao nível atual do usuário na gamificação.
        id_ultimo_acesso:
          type: integer
          description: Registro de referência ou timestamp do último acesso realizado.
        id_sexo:
          type: integer
          description: Chave estrangeira referente à identificação de gênero/sexo.

    # Schema de Missões
    Missoes:
      required:
        - nome
        - descricao
        - coins
        - total_xp_missao
        - data_inicio
        - data_termino
        - id_dificuldade
      type: object
      description: Objeto de representação de uma missão ecológica.
      properties:
        id:
          type: integer
          description: Identificador único da missão.
        nome:
          type: string
          description: Título ou nome identificador da missão.
        descricao:
          type: string
          description: Detalhamento completo dos objetivos e regras da missão.
        coins:
          type: integer
          description: Quantidade de moedas concedidas ao concluir a missão.
        total_xp_missao:
          type: integer
          description: Quantidade total de XP concedida ao concluir a missão.
        data_inicio:
          type: string
          format: date
          description: Data de início da vigência da missão (AAAA-MM-DD).
        data_termino:
          type: string
          format: date
          description: Data limite para a conclusão da missão (AAAA-MM-DD).
        id_dificuldade:
          type: string
          description: Nível de complexidade ou dificuldade atribuído à missão.
        
    # Schema de Desafios
    Desafios:
      required:
        - nome
        - descricao
        - id_dificuldade
      type: object
      description: Objeto de representação de um desafio ecológico.
      properties:
        id:
          type: integer
          description: Identificador único do desafio.
        nome:
          type: string
          description: Título ou nome identificador do desafio.
        descricao:
          type: string
          description: Descrição detalhada do desafio proposto.
        id_dificuldade:
          type: string
          description: Nível de complexidade ou dificuldade do desafio.

    # Schema de Conteúdos Educativos
    Educativos:
      required:
        - nome
        - descricao
        - id_anexo
      type: object
      description: Objeto de representação de um conteúdo educativo/material de apoio.
      properties:
        id:
          type: integer
          description: Identificador único do conteúdo educativo.
        nome:
          type: string
          description: Título do material ou conteúdo educativo.
        descricao:
          type: string
          description: Resumo descritivo ou texto explicativo do conteúdo.
        id_anexo:
          type: array
          items: 
            type: integer
          description: Lista de identificadores dos arquivos anexados ao conteúdo.
          example: [1, 4, 7]

    # Schema de Administradores
    Administrador:
      required:
        - nome
        - email
        - senha
        - id_nivel_acesso
      type: object
      description: Objeto de representação de um administrador do sistema.
      properties:
        id:
          type: integer
          description: Identificador único do administrador.
        nome:
          type: string
          description: Nome completo do administrador.
        email:
          type: string
          format: email
          description: E-mail de autenticação do administrador.
        senha: 
          type: string
          format: password
          description: Senha de acesso do administrador.
        id_nivel_acesso:
          type: integer
          description: Chave estrangeira referente ao nível de permissão administrativa.

    # Schema de Premiações
    Premiacao:
      required:
        - nome
        - descricao
        - codigo_rastreio
        - motivo_premiacao
      type: object
      description: Objeto de representação de uma premiação concedida.
      properties:
        id:
          type: integer
          description: Identificador único da premiação.
        nome:
          type: string
          description: Nome ou título do prêmio concedido.
        descricao:
          type: string
          description: Detalhes adicionais sobre a premiação.
        codigo_rastreio: 
          type: string
          description: Código de rastreamento logístico do envio do prêmio.
        motivo_premiacao:
          type: string
          description: Descrição da justificativa ou conquista que gerou a premiação.

    # Schema de Conquistas
    Conquistas:
      required:
        - nome
        - descricao
        - img
      type: object
      description: Objeto de representação de uma conquista (badge).
      properties:
        id:
          type: integer
          description: Identificador único da conquista.
        nome:
          type: string
          description: Título da conquista desbloqueada.
        descricao:
          type: string
          description: Requisitos necessários para desbloquear a conquista.
        img: 
          type: string
          format: uri
          description: URL ou caminho de referência para o ícone/imagem da conquista.

    # Schema de Recompensas
    Recompensas:
      required:
        - nome
        - descricao
        - valor
        - nivel
      type: object
      description: Objeto de representação de uma recompensa resgatável na loja.
      properties:
        id:
          type: integer
          description: Identificador único da recompensa.
        nome:
          type: string
          description: Nome do item de recompensa.
        descricao:
          type: string
          description: Descrição detalhada da recompensa oferecida.
        valor: 
          type: integer
          description: Custo em moedas (coins) para resgatar a recompensa.
        nivel:
          type: integer
          description: Nível mínimo exigido para o resgate da recompensa.

